name: Release

# The Windows installer needs a Windows runner and the macOS DMG needs a macOS
# runner, so both build here rather than on your machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      # Build only — electron-builder never calls the GitHub API itself. That
      # call resolved the owner from electron-builder.yml, which is how a stale
      # owner turned into a 404 that looked like a token problem.
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      # electron-builder notarizes the .app and then builds the DMG around it,
      # so the DMG itself never gets a ticket. Staple one on so the download
      # verifies offline.
      - name: Notarize and staple the DMGs
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            echo "==> notarizing $dmg"
            xcrun notarytool submit "$dmg" --wait \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # The DMG is only a container. What Gatekeeper actually enforces when the
      # user drags the app to /Applications is the .app inside — so that is what
      # gets gated here.
      #
      # Note: `spctl` on the DMG itself reports "no usable signature", because
      # electron-builder leaves dmg.sign off by default. That is expected and is
      # NOT a failure; the DMG carries a notarization ticket, not a signature.
      - name: Verify the app Gatekeeper will see
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mnt"
            app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
            echo "==> verifying $app"
            codesign --verify --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            # This is the assessment a user's Mac makes on first launch.
            spctl -a -vvv -t exec "$app"
            hdiutil detach "$mnt" -quiet
            echo "==> OK: $dmg"
          done

      - name: List artifacts
        shell: bash
        run: ls -la dist/ || true

      # Always targets the repo this workflow runs in — there is no owner to
      # get wrong. Both jobs upload into the same release.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Only what a user actually downloads. No blockmaps, no latest*.yml —
          # nothing consumes them since the switch off electron-updater.
          files: |
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: false
