appId: com.selectorshub.claudeusagemeter
productName: Claude Usage Meter
copyright: SelectorsHub

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - assets/**/*
  - package.json

# One name shape everywhere, so re-runs overwrite instead of accumulating.
artifactName: ${name}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Menu bar only: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: 1
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  # No differential-update metadata: nothing consumes it now.
  writeUpdateInfo: false
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  # Launch straight after install so the sign-in prompt appears immediately.
  runAfterFinish: true

