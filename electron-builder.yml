appId: com.selectorshub.claudeusagemeter
productName: Claude Usage Meter
copyright: SelectorsHub

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - assets/**/*
  - package.json

publish:
  provider: github
  owner: selectorshub@gmail.com
  repo: Claude-Usage-Meter-Desktop

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Menu bar only: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: 1
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  # Launch straight after install so the sign-in prompt appears immediately.
  runAfterFinish: true

linux:
  target: [AppImage]
  category: Utility
